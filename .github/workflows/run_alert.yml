name: Wind alert check

on:
  schedule:
    - cron: "*/10 4-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wind-alert-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wind alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PYTHONPATH: src
        run: python src/main.py --config config.yaml

      - name: Commit updated state
        run: |
          git config user.name "wind-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
