name: Wind alert check
run-name: "Wind alert check (${{ inputs.trigger || github.event_name }})"

on:
  # GitHub's schedule is best-effort: in practice it runs a few times a day, not
  # every 10 minutes. The reliable trigger is the external pinger that calls
  # workflow_dispatch (tools/apps-script/pinger.gs, docs/hosting-github-actions.md);
  # the cron stays as a fallback.
  schedule:
    - cron: "*/10 4-21 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Who started this run (the external pinger sends 'pinger')"
        type: string
        required: false
        default: manual

permissions:
  contents: write

concurrency:
  group: wind-alert-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # branch head at checkout time, not the event's commit: a pending run must see the state the previous run pushed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wind alert check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PYTHONPATH: src
        run: python src/main.py --config config.yaml

      - name: Commit updated state
        run: |
          git config user.name "wind-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
